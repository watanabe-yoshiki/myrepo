<!DOCTYPE html>

<head>

<title>極みの逸品</title>
<meta charset="UTF-8" />
<meta id="viewport" name="viewport" content="initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Pragma" content="no-cache" />

<script language="JavaScript" type="text/javascript">
    var isLibra = false;
    var scormScoreKind;
    function checkScorm() {

        if (location.href.match(/s=12/)) {
            scormScoreKind = "1.2";
        } else if (location.href.match(/s=2004/)) {
            scormScoreKind = "2004";
        } else if (location.href.match(/s=score/)){
            scormScoreKind = "score";
        }
        document.write("<scr" + "ipt type='text/javascript' src='m/js/sscontrol.min.js'></scr" + "ipt>");
    }

    /***
     *  SCORM初期化が完了されるとコールされるメソッド
     */
    function scormInitilaized(){
        if (location.href.match(/s=12/)) {
            scormSetValue("cmi.core.lesson_status", "completed");
            SCOCommit();
        } else if (location.href.match(/s=2004/)) {
            scormSetValue("cmi.success_status", "passed");
            scormSetValue("cmi.completion_status", "completed");
            SCOCommit();
        }
    }

    function scormSetValue(model, value) {
        var result = scormCommand("LMSSetValue", model + "," + value);
        return result;
    }

    checkScorm();

    function checkAgent() {
        if (navigator.userAgent.indexOf("Android") != -1 || navigator.userAgent.match(/Silk\/([0-9_.]+)/)) {
            document.write("<scr" + "ipt type='text/javascript' src='m/js/android.js'></scr" + "ipt>");
        } else {
            document.write("<scr" + "ipt type='text/javascript' src='m/js/flipper.js'></scr" + "ipt>");
        }
    }
    checkAgent();
</script>

</head>
