<!DOCTYPE html>
<html>
<head>
<title>極みの逸品</title>

<meta charset="UTF-8" />
<meta id="viewport" name="viewport" content="initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="cache-control" content="no-cache, no-store" />
<meta http-equiv="expires" content="0" />

<link rel="apple-touch-icon-precomposed" href="./images/apple-touch-icon.png" />
<script type="text/javascript" src="../flipper3js/redirector_home_m.js"></script>
<style type="text/css">
    body, html {
        padding: 0;
        margin: 0;
        width:  100%;
        height: 100%;

    }
    #fl-parent {
        padding: 0;
        margin: 0;
        width:  100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>

<script language="JavaScript" type="text/javascript">
    function setLocation() {
        document.getElementById("fl-parent").src = "index_inner.html" + window.location.search + window.location.hash;
    }
    function mflAction(obj) {
        document.getElementById("fl-parent").contentWindow.mflAction(obj);
    }
    function mflIndexEvent(obj) {
        if (window != parent && window.parent.flipperAPI) {
            window.parent.flipperAPI.mflEvent(obj);
        }
    }
</script>
</head>
<body onLoad="setLocation()">
<iframe id="fl-parent" src="" border="0" height="100%" width="100%" hspace="0" vspace="0" marginheight="0" marginwidth="0" frameborder="0" scrolling="no" seamless></iframe>
</body>
</html>
